<meta name="theme-color" content="#14234A">
<meta name="apple-mobile-web-app-title" content="Hebahan JPPS">

<style id="app-css">
:root{
  color-scheme: light;
  --navy:#14234A; --navy-2:#20386B; --navy-3:#2C4A86;
  --gold:#C9A227; --gold-2:#E3C35C; --gold-soft:#FBF3D9;
  --bg:#F5F2EA; --surface:#FFFFFF; --surface-2:#FAF8F3;
  --ink:#1A2133; --muted:#5E6577; --line:#DED7C6; --line-2:#ECE7DA;
  --wk:#EEF1F6; --fri:#1E8E4F; --red:#D32F2F; --red-soft:#FDE7E7;
  --isl:#00897B; --sch:#FFE15A; --sch-soft:#FFFBE2;
  --c-besar-bg:#FFE7A3; --c-besar-bd:#E0A81E; --c-besar-tx:#6A4500;
  --c-ceramah-bg:#D5F1E1; --c-ceramah-bd:#34A26E; --c-ceramah-tx:#0F5634;
  --c-taklimat-bg:#FFE0CF; --c-taklimat-bd:#EA7440; --c-taklimat-tx:#8A3110;
  --c-fa-bg:#DCE7FF; --c-fa-bd:#4A7BDC; --c-fa-tx:#1B3C8A;
  --c-haji-bg:#ECDDFB; --c-haji-bd:#9466D6; --c-haji-tx:#4C228E;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(20,35,74,.06),0 8px 24px rgba(20,35,74,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Header */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);color:#fff;padding:20px 16px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2),var(--gold))}
.hero-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.appicon{flex:none;width:68px;height:68px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.appicon img{width:100%;height:100%;object-fit:contain;display:block}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.orglogo{background:#fff;border-radius:12px;padding:7px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);line-height:0}
.orglogo img{height:34px;width:auto;display:block}
.seal{flex:none;width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--gold-2);background:rgba(255,255,255,.04)}
.hero h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1.15}
.hero h1 .hy{color:var(--gold-2)}
.hero .sub{opacity:.88;font-size:13.5px;margin-top:2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:12.5px;white-space:nowrap}
.pill b{color:var(--gold-2);font-weight:600}

/* Toolbar */
.bar{position:sticky;top:0;z-index:30;background:rgba(245,242,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 16px}
.bar-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}
.tabs button:not(.on):hover{background:var(--surface-2);color:var(--ink)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--navy-3)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#241a00}
.btn.pri:hover{background:var(--gold-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:#F1C4C4}
.btn.ghost{background:transparent}
.btn.au{font-size:12.5px;padding:7px 11px}
.btn.au .adot{width:9px;height:9px;border-radius:50%;background:#9AA3B5;flex:none}
.btn.au-on{border-color:#9ED5B5;background:#EEF9F2;color:#0F5634}.btn.au-on .adot{background:#22A55A}
.btn.au-busy{border-color:#E8D18A;background:#FFF8E1;color:#6A4F00}.btn.au-busy .adot{background:var(--gold);animation:pulse 1s infinite}
.btn.au-warn{border-color:#EBCB6E;background:#FFF4D6;color:#6A4F00}.btn.au-warn .adot{background:#E0A81E}
.btn.au-err{border-color:#E9A3A3;background:#FDECEC;color:#9B1C1C}.btn.au-err .adot{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.btn .dot{width:8px;height:8px;border-radius:50%;background:#B3261E;display:none}
.btn.dirty .dot{display:inline-block}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;z-index:40}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:13.5px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}

.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 40px}
.banner{max-width:1400px;margin:12px auto 0;padding:0 16px}
.banner .in{background:#FFF4D6;border:1px solid #EBCB6E;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13.5px}

/* Filter / legend chips */
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.legend .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.lg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 7px;font-size:12.5px;font-weight:600;transition:opacity .15s}
.lg .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid;flex:none}
.lg .n{color:var(--muted);font-weight:500}
.lg.off{opacity:.42}
.lg.off .sw{background:transparent!important}

/* Month grid (screen) */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,620px),1fr));gap:18px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mh{display:flex;align-items:baseline;gap:10px;padding:10px 14px 8px;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff}
.mh .my{font-family:var(--f-head);font-weight:600;font-size:12px;color:var(--gold-2);letter-spacing:.06em}
.mh .mn{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.06em;flex:1}
.mh .mhj{font-size:11.5px;font-weight:600;opacity:.85;letter-spacing:.03em;text-align:right}
table.mt{width:100%;border-collapse:collapse;table-layout:fixed}
.mt th{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:5px 2px;background:var(--surface-2);border-bottom:1px solid var(--line);color:var(--navy)}
.mt th.fri{color:var(--fri)} .mt th.wkd{color:var(--red)}
.mt th.wcol,.mt td.wl{width:62px}
.mt td{border:1px solid var(--line-2);vertical-align:top;padding:0}
.mt td.wl{background:var(--surface-2);font-size:10px;font-weight:700;color:var(--muted);text-align:center;vertical-align:middle;letter-spacing:.03em}
.mt td.wkc{background:var(--wk)}
.mt td.empty{background:repeating-linear-gradient(135deg,#fafafa 0 6px,#f3f3f3 6px 12px)}
.mt td.empty.wkc{background:repeating-linear-gradient(135deg,#eef1f6 0 6px,#e6eaf1 6px 12px)}
.mt td.sch:not(.wkc){background:var(--sch-soft)}
.cw{min-height:76px;padding:3px 3px 4px;display:flex;flex-direction:column;gap:2px}
.day{cursor:pointer;transition:background .12s}
.day:hover .cw{background:rgba(201,162,39,.09)}
.dn{display:flex;justify-content:space-between;align-items:center;gap:2px}
.num{font-weight:700;font-size:13px;min-width:21px;height:19px;padding:0 3px;border-radius:5px;display:inline-grid;place-items:center;border:1px solid transparent}
.fri .num{color:var(--fri)}
.sch .num{background:var(--sch);border-color:#D6B514}
.hol .num{color:var(--red)}
.hj{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.hn{font-size:10px;font-weight:700;color:var(--red);line-height:1.15;text-transform:uppercase;letter-spacing:.01em}
.hn.isl{color:var(--isl)}
.hn.lain{color:#6B5BA8}
.chip{font-size:10px;font-weight:700;line-height:1.18;padding:3px 4px;border-radius:5px;border-left:3px solid;text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.chip:hover{filter:brightness(.96);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.chip.st-Ditangguh{text-decoration:line-through;opacity:.6}
.chip.st-Disahkan::after{content:" ✓";color:#0F5634}
.c-besar{background:var(--c-besar-bg);border-color:var(--c-besar-bd);color:var(--c-besar-tx)}
.c-ceramah{background:var(--c-ceramah-bg);border-color:var(--c-ceramah-bd);color:var(--c-ceramah-tx)}
.c-taklimat{background:var(--c-taklimat-bg);border-color:var(--c-taklimat-bd);color:var(--c-taklimat-tx)}
.c-fa{background:var(--c-fa-bg);border-color:var(--c-fa-bd);color:var(--c-fa-tx)}
.c-haji{background:var(--c-haji-bg);border-color:var(--c-haji-bd);color:var(--c-haji-tx)}
.sw.c-besar{background:var(--c-besar-bg);border-color:var(--c-besar-bd)}
.sw.c-ceramah{background:var(--c-ceramah-bg);border-color:var(--c-ceramah-bd)}
.sw.c-taklimat{background:var(--c-taklimat-bg);border-color:var(--c-taklimat-bd)}
.sw.c-fa{background:var(--c-fa-bg);border-color:var(--c-fa-bd)}
.sw.c-haji{background:var(--c-haji-bg);border-color:var(--c-haji-bd)}
.sw.sw-hol{background:var(--red-soft);border-color:var(--red)}
.sw.sw-sch{background:var(--sch);border-color:#D6B514}
.sw.sw-isl{background:#DDF1EE;border-color:var(--isl)}
.today .num{outline:2px solid var(--navy);outline-offset:1px}

/* Cards / tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.card h2,.card h3{font-family:var(--f-head);margin:0 0 10px;color:var(--navy)}
.card h2{font-size:17px} .card h3{font-size:15px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h2{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px;min-width:0}
.filters input{flex:1 1 220px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.lt{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
.lt th{background:var(--navy);color:#fff;text-align:left;font-weight:600;font-size:12px;letter-spacing:.03em;padding:9px 10px;white-space:nowrap}
.lt td{padding:8px 10px;border-top:1px solid var(--line-2);vertical-align:top}
.lt tr.mrow td{background:var(--gold-soft);font-family:var(--f-head);font-weight:700;color:var(--navy);font-size:12.5px;letter-spacing:.05em;padding:6px 10px}
.lt tbody tr.r{cursor:pointer}
.lt tbody tr.r:hover td{background:#FBF8EE}
.lt .nm{font-weight:600}
.lt .sm{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.st{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EEF1F6;color:#3A4560;white-space:nowrap}
.st.Disahkan{background:#DDF3E6;color:#0F5634}
.st.Selesai{background:#E1E8F7;color:#1B3C8A}
.st.Ditangguh{background:#FDE7E7;color:#9B1C1C}
.warn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:#9B1C1C;background:#FDECEC;border-radius:6px;padding:1px 6px;margin:2px 4px 0 0}
.warn.info{color:#5D4A00;background:#FFF5CF}
.warn.mid{color:#8A3110;background:#FFE8DC}
.empty-note{padding:24px;text-align:center;color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--navy)}
.stat .v{font-family:var(--f-head);font-size:26px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat.c-besar,.stat.c-ceramah,.stat.c-taklimat,.stat.c-fa,.stat.c-haji{background:var(--surface);color:var(--ink);border-left:1px solid var(--line)}
.stat.c-besar{border-top-color:var(--c-besar-bd)} .stat.c-ceramah{border-top-color:var(--c-ceramah-bd)} .stat.c-taklimat{border-top-color:var(--c-taklimat-bd)} .stat.c-fa{border-top-color:var(--c-fa-bd)} .stat.c-haji{border-top-color:var(--c-haji-bd)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:8px}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.bars .stack span{display:block;border-left:0!important;border-radius:0}
.bars .bl{font-size:10.5px;color:var(--muted);font-weight:600}
.bars .bv{font-size:11px;font-weight:700}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th,.mini td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.mini th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mini td.n{text-align:right;font-weight:700}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface-2)}
.wlist li:hover{border-color:var(--navy-3)}
.ok{color:#0F5634;font-weight:600}

/* Dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 24px 64px rgba(10,20,40,.3);color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(14,22,44,.45)}
.dh{padding:14px 18px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2}
.dh h3{margin:0;font-family:var(--f-head);font-size:16px;font-weight:600}
.dh .x{border:0;background:transparent;color:#fff;font-size:22px;line-height:1;padding:0 4px}
.db{padding:16px 18px}
.df{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2)}
.df .sp{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-size:14px}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.opt b{display:block;font-size:14px}
.opt span{font-size:12.5px;color:var(--muted)}
.dayhead{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--navy);margin-bottom:2px}
.daysub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ditem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:8px;cursor:pointer}
.ditem:hover{border-color:var(--navy-3)}
.ditem .bar{position:static;width:5px;align-self:stretch;border-radius:3px;padding:0;border:0;backdrop-filter:none}
.livewarn{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.help ol{padding-left:20px;margin:0} .help li{margin-bottom:8px}

.nextc{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.nextc .dt{width:60px;flex:none;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line)}
.nextc .dt .m{background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 0}
.nextc .dt .d{font-family:var(--f-head);font-size:24px;font-weight:700;color:var(--navy);line-height:1.15}
.nextc .dt .w{font-size:10px;font-weight:600;color:var(--muted);padding-bottom:4px;text-transform:uppercase}
.nextc .tx{flex:1;min-width:200px}
.nextc .lb{font-size:11px;font-weight:700;letter-spacing:.12em;color:#A88317;text-transform:uppercase}
.nextc h3{margin:1px 0 2px;font-family:var(--f-head);font-size:17px;color:var(--navy);line-height:1.3}
.nextc .mt2{font-size:13px;color:var(--muted)}
.nextc .cd{background:var(--navy);color:#fff;border-radius:12px;padding:8px 14px;text-align:center;min-width:84px}
.nextc .cd b{display:block;font-family:var(--f-head);font-size:24px;line-height:1.05;color:var(--gold-2)}
.nextc .cd span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.calbtns{display:flex;flex-wrap:wrap;gap:6px}
.calbtns a,.calbtns button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;cursor:pointer}
.calbtns.cmp{flex-wrap:nowrap}.calbtns.cmp a,.calbtns.cmp button{padding:5px 8px;font-size:12px}
.calbtns a:hover,.calbtns button:hover{border-color:var(--navy-3);background:var(--surface-2)}
.calbtns .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.vrow{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:10px 0 14px}
.vrow dt{color:var(--muted);font-weight:600;font-size:12.5px}
.vrow dd{margin:0}
.vkat{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.ro .day{cursor:pointer}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1400px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

@media (max-width:760px){
  table.lt,table.lt2{min-width:0!important}
  .tscroll{overflow-x:visible}
  .lt thead{display:none}
  .lt,.lt tbody{display:block;width:100%}
  .lt tr.mrow{display:block}
  .lt tr.mrow td{display:block;border-top:0}
  .lt tr.r{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;padding:12px 14px;border-top:1px solid var(--line-2)}
  .lt tr.r td{display:block;border:0;padding:0;white-space:normal!important;min-width:0!important}
  .lt .c-no{display:none!important}
  .lt .c-prog{order:1;width:100%;font-size:14.5px}
  .lt .c-tgl{order:2;font-weight:700;color:var(--navy)}
  .lt .c-hari{order:3;font-weight:600;color:var(--navy)}
  .lt .c-masa{order:4}
  .lt .c-masa::before{content:"· "}
  .lt .c-hj{order:5;width:100%}
  .lt .c-kat{order:6}
  .lt .c-st{order:7}
  .lt .c-peng{order:8;width:100%;font-size:12.5px;color:var(--muted)}
  .lt .c-peng::before{content:"Pengarah: ";font-weight:600}
  .lt .c-cal{order:9;width:100%;margin-top:6px}
  .lt .c-cal .calbtns.cmp{flex-wrap:wrap}
  .lt .c-sem{order:10;width:100%;margin-top:2px}
  .lt2 tr.r{gap:2px 10px}
  .lt2 tr.r td.nm{order:-1;width:100%}
  .lt2 .c-akhir::before{content:"– "}
  .lt2 .c-n{color:var(--muted)}
  .lt2 .c-n::before{content:"("}
  .lt2 .c-n::after{content:" hari)"}
}
@media (max-width:640px){
  .hero h1{font-size:21px}
  .appicon{width:54px;height:54px}
  .hero-right{align-items:flex-start;width:100%}
  .orglogo img{height:26px}
  .mt th.wcol,.mt td.wl{width:26px}
  .mt td.wl{font-size:0}
  .mt td.wl::after{content:attr(data-w);font-size:10px}
  .mt th{font-size:9px}
  .cw{min-height:60px;padding:2px}
  .num{font-size:11.5px;min-width:17px;height:17px}
  .hj{font-size:7px;letter-spacing:-.02em}
  .dn{flex-wrap:wrap;gap:0 2px}
  .mt td.wl::after{font-weight:700}
  .chip{font-size:8.5px;padding:2px 3px;border-left-width:2px}
  .hn{font-size:8.5px}
  .mh .mn{font-size:15px}
  .fg{grid-template-columns:1fr}

#print-area{display:none}
.hb{font-family:Arial,'Liberation Sans','Helvetica Neue',sans-serif;color:#000;font-size:10pt;line-height:1.22}
.hb .hbin{padding:0 4mm}
.hb .logo{text-align:center;line-height:0;margin-bottom:.4em}
.hb .logo img{height:4.4em;width:auto}
.hb h1{text-align:center;font-size:1.3em;font-weight:700;margin:.3em 0 0;letter-spacing:.01em}
.hb h2{text-align:center;font-size:1.3em;font-weight:700;font-style:italic;margin:0 0 .6em}
.hb h3{font-size:1.08em;font-weight:700;margin:1em 0 .35em}
.hb table{width:100%;border-collapse:collapse;table-layout:fixed}
.hb th{background:#D9D9D9;border:.8pt solid #000;padding:.28em .4em;font-weight:700;text-align:center;font-size:.95em}
.hb td{border:.8pt solid #000;padding:.24em .45em;vertical-align:middle;font-size:.95em}
.hb td.c{text-align:center}
.hb .nt{font-style:italic;font-size:.9em;margin-top:.8em}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
.pp{font-family:var(--f-body);color:#111}
.pp .page{break-after:page;page-break-after:always}
.pp .page:last-child{break-after:auto;page-break-after:auto}
.pp .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:1.2mm solid var(--navy);padding-bottom:1.5mm;margin-bottom:2.5mm}
.pp .ph .lg1{height:13mm;width:auto;margin-right:3mm}
.pp .ph .lg2{height:8.5mm;width:auto;margin-left:4mm}
.pp .ph .l{display:flex;align-items:center}
.pp .ph .r{display:flex;align-items:center;flex:none}
.pp .ph .t2,.pp .ph .t3{white-space:nowrap}
.pp .ph .t1{white-space:nowrap;font-size:12.5pt!important}
.pp .ph .t3{font-size:6.4pt}
.pp .ph .lg2{height:7.5mm}
.pp .ph .lg1{height:11.5mm}
.pp .ph{gap:4mm}
.pp .ph .l{min-width:0}
.pl .ttl .logos{display:flex;align-items:center;justify-content:center;gap:10mm;margin-bottom:2mm}
.pl .ttl .logos img{height:20mm;width:auto}
.pl .ttl .logos img.w{height:11mm}
.pp .ph .t1{font-family:var(--f-head);font-weight:700;font-size:15pt;color:var(--navy);letter-spacing:.03em;line-height:1.1}
.pp .ph .t1 span{color:#A88317}
.pp .ph .t2{font-size:7.5pt;color:#333}
.pp .ph .t3{text-align:right;font-size:7pt;color:#444;line-height:1.35}
.pp .ph .t1{font-size:11.5pt!important}
.pp .ph .t3{font-size:6.2pt;white-space:normal;max-width:60mm}
.pp .ph .r{flex:0 1 auto;min-width:0}
.pp .ph .lg1{height:10mm}
.pp .ph .lg2{height:6.5mm;margin-left:3mm}
.pp .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm 3mm}
.pp .page.fill{height:270mm;display:flex;flex-direction:column;overflow:hidden}
.pp .page.fill .pgrid{flex:1;min-height:0;grid-template-rows:repeat(6,minmax(0,1fr))}
.pg1 .pgrid{grid-auto-flow:column}
.pp .page.fill .month{overflow:hidden;min-height:0}
.pp .chip{white-space:normal;overflow-wrap:break-word;word-break:normal}
.pp .chip,.pp .hn,.pp .hj,.pp td.wl{font-family:'TakwimCond','Roboto Condensed','Arial Narrow',sans-serif;letter-spacing:0}
.pp .month{border-radius:1.5mm;box-shadow:none;border:.25mm solid #888;break-inside:avoid}
.pp .mh{padding:.6mm 2mm;background:var(--navy)}
.pp .mt td{border:.2mm solid #9a9a9a}
.pp .mt th{border-bottom:.2mm solid #888;padding:.4mm 0}
.pp .day:hover .cw{background:none}
.pp .pleg{display:flex;flex-wrap:wrap;gap:1.2mm 3.5mm;align-items:center;margin-top:2.2mm;font-size:6.6pt;color:#222}
.pp .pleg i{display:inline-block;width:3mm;height:3mm;border:.3mm solid;border-radius:.6mm;vertical-align:-.5mm;margin-right:1mm}
.pp .pleg .nt{margin-left:auto;font-style:italic;color:#555}
/* 1 page */
.pg1 .mh{padding:.25mm 2mm;line-height:1.12} .pg1 .mh .my{font-size:6.5pt} .pg1 .mh .mn{font-size:9pt} .pg1 .mh .mhj{font-size:5.6pt}
.pg1 .pgrid{gap:1.3mm 3mm}
.pg1 .ph .lg1{height:9.5mm} .pg1 .ph .lg2{height:6.5mm} .pg1 .ph{padding-bottom:1mm}
.pg1 .pleg{margin-top:1.4mm}
.pg1 .ph .t1{font-size:13pt}
.pg1 .mt th{padding:.2mm 0;line-height:1.2}
.pg1 .mt th{font-size:5.5pt}
.pg1 .mt th.wcol,.pg1 .mt td.wl{width:9.5mm}
.pg1 .mt td.wl{font-size:4.8pt;line-height:1.1;letter-spacing:0}
.pg1 .cw{min-height:0;height:5.9mm;overflow:hidden;padding:.2mm .3mm;gap:.15mm}
.pg1 .num{font-size:6pt;line-height:1;min-width:3.2mm;height:2.35mm;border-radius:.5mm;padding:0 .3mm}
.pg1 .hj{font-size:4.6pt}
.pg1 .dn{line-height:1}
.pg1 .chip{font-size:5.4pt;line-height:1.02;padding:.1mm .35mm;border-left-width:.6mm;border-radius:.5mm}
.pg1 .hn{font-size:5.2pt;line-height:1.02}
.pg1 .ph{margin-bottom:1.6mm}
/* 2 pages */
.pg2 .pgrid{gap:3mm 4mm;grid-auto-flow:column}
.pg2 .page.fill .pgrid{grid-template-rows:repeat(3,minmax(0,1fr))}
.pg2 .mh{padding:.5mm 3mm;line-height:1.2}
.pg2 .mh .my{font-size:7.5pt} .pg2 .mh .mn{font-size:10.5pt} .pg2 .mh .mhj{font-size:6.8pt}
.pg2 .mt th{font-size:6.4pt;padding:.4mm 0;line-height:1.2}
.pg2 .mt th.wcol,.pg2 .mt td.wl{width:9.5mm}
.pg2 .mt td.wl{font-size:5pt;letter-spacing:0}
.pg2 .cw{min-height:0;height:5.8mm;overflow:hidden;padding:.35mm .6mm;gap:.3mm}
.pg2 .num{font-size:8pt;line-height:1;min-width:4.2mm;height:3.5mm;border-radius:.7mm}
.pg2 .hj{font-size:5.8pt}
.pg2 .chip{font-size:6.6pt;line-height:1.08;padding:.4mm .6mm;border-left-width:.8mm;border-radius:.7mm}
.pg2 .hn{font-size:6.4pt;line-height:1.08}
.pg2 .dn{line-height:1}
/* lists */
.pl table{width:100%;border-collapse:collapse;font-size:8.6pt}
.pl th{background:var(--navy);color:#fff;text-align:left;padding:1.4mm 2mm;font-size:7.6pt;letter-spacing:.03em}
.pl td{padding:1.3mm 2mm;border-bottom:.2mm solid #bbb;vertical-align:top}
.pl tr.mrow td{background:var(--gold-soft);font-weight:700;color:var(--navy);font-size:8pt;letter-spacing:.05em}
.pl tr{break-inside:avoid}
.pl h3{font-family:var(--f-head);color:var(--navy);font-size:11pt;margin:5mm 0 1.2mm}
.pl .ket{font-size:8pt;color:#333;margin:0 0 2mm;font-style:italic}
.pl .ttl{text-align:center;margin:1mm 0 3mm}
.pl .ttl .a{font-family:var(--f-head);font-weight:700;font-size:16pt;color:var(--navy)}
.pl .ttl .b{font-size:9.5pt;font-weight:600;letter-spacing:.04em}
.pl .nt{font-size:7.6pt;font-style:italic;color:#555;margin-top:4mm}
.pl.one table{table-layout:fixed}
.pl.one td{padding:1mm 1.6mm;font-size:8.4pt}
.pl.one th{padding:1.2mm 1.6mm}
.pl.one tr.mrow td{padding:.8mm 1.6mm}
.pl .ct{color:#555;font-size:.88em;font-weight:400}
.pl .kc{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm;border:.3mm solid;vertical-align:-.3mm;margin-right:1.2mm}
</style>
</head>

<script id="app-js">
(function(){

var ICO=attr('ico','href'), ICOT=attr('ico-touch','href'), IMG_EMB=attr('img-emb','src'), IMG_PUS=attr('img-pus','src'), IMG_US=attr('img-us','src'), IMG_APP=attr('img-app','src');

var HARI = ['Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu','Ahad'];

/* ---- helpers ---- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function iso(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function toD(s){var a=s.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]))}
function fromD(d){return d.toISOString().slice(0,10)}
function addDays(s,n){var d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fromD(d)}
function dow(s){return (toD(s).getUTCDay()+6)%7}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function diff(a,b){return Math.round((toD(b)-toD(a))/864e5)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function validISO(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}
function fmtD(s,long){var d=toD(s);return d.getUTCDate()+' '+(long?BULAN:BLN)[d.getUTCMonth()]+' '+d.getUTCFullYear()}
function fmtStamp(s){try{var d=new Date(s);var h=d.getHours(),m=d.getMinutes();var ap=h<12?'pagi':(h<19?'ptg':'mlm');var hh=h%12||12;return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()+', '+hh+'.'+pad(m)+' '+ap}catch(e){return s}}
function katById(id){for(var i=0;i<S.kategori.length;i++)if(S.kategori[i].id===id)return S.kategori[i];return {id:id,nama:id}}
function katName(id){return katById(id).nama}

/* ---- Hijri (table from JAKIM/MABIMS; fallback Umm al-Qura estimate) ---- */
var IFMT=null;
function hijri(s){
  var hs=S.hs||[];
  if(hs.length && s>=hs[0][0] && s<=addDays(hs[hs.length-1][0],29)){
    var k=0;for(var i=0;i<hs.length;i++){if(hs[i][0]<=s)k=i;else break}
    return {d:diff(hs[k][0],s)+1,m:hs[k][1],y:hs[k][2]};
  }
  try{
    IFMT=IFMT||new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});
    var o={};IFMT.formatToParts(toD(s)).forEach(function(p){o[p.type]=p.value});
    return {d:parseInt(o.day,10),m:parseInt(o.month,10)-1,y:parseInt(o.year,10),est:true};
  }catch(e){return null}
}
function hShort(s){var h=hijri(s);return h?h.d+' '+HMS[h.m]:''}
function hLong(s){var h=hijri(s);return h?h.d+' '+HM[h.m]+' '+h.y+'H':''}

/* ---- index ---- */
function daysOf(p){
  var out=[p.tarikh];
  if(p.hingga && p.hingga>p.tarikh){var d=p.tarikh,n=0;while(d<p.hingga&&n<62){d=addDays(d,1);out.push(d);n++}}
  return out;
}
function sortP(a,b){return a.tarikh<b.tarikh?-1:a.tarikh>b.tarikh?1:(a.masa||'').localeCompare(b.masa||'')}
function buildIndex(){
  IDX={};
  function g(k){return IDX[k]||(IDX[k]={t:[],p:[],s:null})}
  S.tarikh.forEach(function(t){if(validISO(t.tarikh))g(t.tarikh).t.push(t)});
  S.program.slice().sort(sortP).forEach(function(p){if(validISO(p.tarikh))daysOf(p).forEach(function(d){g(d).p.push(p)})});
  S.sekolah.forEach(function(s){if(!validISO(s.mula)||!validISO(s.akhir))return;var d=s.mula,n=0;while(d<=s.akhir&&n<400){g(d).s=s;d=addDays(d,1);n++}});
}
function at(d){return IDX[d]||{t:[],p:[],s:null}}
function isHol(t){return t.jenis==='cuti'||t.jenis==='ganti'}

/* ---- checks ---- */
function semak(p){
  var w=[];
  daysOf(p).forEach(function(d){
    var x=at(d);
    var h=x.t.filter(isHol);
    if(h.length)w.push({l:'hi',t:'Cuti umum: '+h.map(function(t){return t.nama}).join(', ')+' ('+fmtD(d)+')'});
    var o=x.p.filter(function(q){return q.id!==p.id});
    if(o.length)w.push({l:'mid',t:'Pertembungan: '+o.map(function(q){return q.nama}).join(', ')+' ('+fmtD(d)+')'});
  });
  var dw=dow(p.tarikh);
  if(dw>=5)w.push({l:'info',t:'Hujung minggu ('+HARI[dw]+')'});
  var sc=at(p.tarikh).s; if(sc)w.push({l:'info',t:'Cuti sekolah: '+sc.nama});
  if(!p.pengarah)w.push({l:'info',t:'Pengarah belum ditetapkan'});
  if(p.tarikh.slice(0,4)!==String(S.meta.tahun))w.push({l:'mid',t:'Di luar tahun '+S.meta.tahun});
  return w;
}
function warnHTML(w){return w.map(function(x){return '<span class="warn '+(x.l==='info'?'info':x.l==='mid'?'mid':'')+'">'+(x.l==='info'?'ⓘ':'⚠')+' '+esc(x.t)+'</span>'}).join('')}

/* ---- header ---- */
function hyRange(){var y=S.meta.tahun;var a=hijri(y+'-01-01'),b=hijri(y+'-12-31');return a&&b?(a.y===b.y?a.y+'H':a.y+'–'+b.y+'H'):''}
function renderHeader(){
  var y=S.meta.tahun;
  document.title=S.meta.tajuk+' '+y;

  $('#foot').innerHTML='<span>'+esc(S.meta.kawasan||'')+'</span><span>'+esc(S.meta.nota||'')+'</span><span>Versi '+(S.meta.versi||1)+'</span>';
  $('#b-save').classList.toggle('dirty',dirty);
}

/* ---- month grid ---- */
function monthHTML(y,m,interactive){
  var first=iso(y,m,1),off=dow(first),n=dim(y,m),slots=[];
  for(var i=0;i<42;i++)slots.push(null);
  for(var d=1;d<=n;d++)slots[off+d-1]=d;
  for(i=35;i<42;i++)if(slots[i]){slots[i-35]=slots[i];slots[i]=null}  /* fold week 6 into week 1 */
  var h1=hijri(first),h2=hijri(iso(y,m,n)),hr='';
  if(h1&&h2)hr=h1.y===h2.y?(h1.m===h2.m?HM[h1.m]:HM[h1.m]+' – '+HM[h2.m])+' '+h1.y+'H':HM[h1.m]+' '+h1.y+' – '+HM[h2.m]+' '+h2.y+'H';
  var o='<div class="month"><div class="mh"><span class="my">'+y+'</span><span class="mn">'+BULAN[m].toUpperCase()+'</span><span class="mhj">'+esc(hr.toUpperCase())+'</span></div><table class="mt"><thead><tr><th class="wcol"></th>';
  HARI.forEach(function(h,i){o+='<th class="'+(i===4?'fri':i>4?'wkd':'')+'">'+h.toUpperCase()+'</th>'});
  o+='</tr></thead><tbody>';
  var today=fromD(new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())));
  for(var r=0;r<5;r++){
    o+='<tr><td class="wl" data-w="'+(r+1)+'">MINGGU '+(r+1)+'</td>';
    for(var c=0;c<7;c++){
      var dd=slots[r*7+c],wk=c>4?' wkc':'';
      if(!dd){o+='<td class="empty'+wk+'"><div class="cw"></div></td>';continue}
      var ds=iso(y,m,dd),x=at(ds),cls='day'+wk+(c===4?' fri':'');
      var hols=x.t.filter(isHol);
      if(hols.length)cls+=' hol';
      if(x.s&&!hide.sch)cls+=' sch';
      if(ds===today)cls+=' today';
      o+='<td class="'+cls+'" data-d="'+ds+'"><div class="cw"><div class="dn"><span class="num">'+dd+'</span><span class="hj">'+esc(hShort(ds))+'</span></div>';
      x.t.forEach(function(t){
        if(t.jenis==='islam'&&hide.isl)return;
        if(isHol(t)&&hide.hol)return;
        o+='<div class="hn'+(t.jenis==='islam'?' isl':t.jenis==='lain'?' lain':'')+'" title="'+esc(t.nama)+'">'+esc(t.label||t.nama)+'</div>';
      });
      x.p.forEach(function(p){
        if(hide[p.kat])return;
        var lab=(p.label||p.nama);if(p.kat==='besar'&&lab.charAt(0)!=='★')lab='★ '+lab;
        o+='<div class="chip c-'+esc(p.kat)+' st-'+esc(p.status||'')+'" data-p="'+esc(p.id)+'" title="'+esc(p.nama+(p.masa?' · '+p.masa:'')+(p.pengarah?' · '+p.pengarah:''))+'">'+esc(lab)+'</div>';
      });
      o+='</div></td>';
    }
    o+='</tr>';
  }
  return o+'</tbody></table></div>';
}
function legendItems(){

function renderSemakan(){
  var y=String(S.meta.tahun),P=S.program.filter(function(p){return p.tarikh.slice(0,4)===y}).sort(sortP);

  S.kategori.forEach(function(k){o+='<div class="stat c-'+k.id+'"><div class="v">'+(cnt[k.id]||0)+'</div><div class="k">'+esc(k.nama)+'</div></div>'});
  o+='</div><div class="grid2">';
  /* monthly bars */
  var mx=1,bym=[];for(var m=0;m<12;m++){bym[m]={};var t=0;P.forEach(function(p){if(+p.tarikh.slice(5,7)-1===m){bym[m][p.kat]=(bym[m][p.kat]||0)+1;t++}});bym[m].t=t;mx=Math.max(mx,t)}
  o+='<div class="card"><h3>Taburan program mengikut bulan</h3><div class="bars">';

  o+='</div></div>';
  /* pengarah */
  var pc={};P.forEach(function(p){var k=p.pengarah||'(belum ditetapkan)';pc[k]=pc[k]||{n:0,b:0,t:0};pc[k].n++;if(p.kat==='besar')pc[k].b++;if(p.timbalan){pc[p.timbalan]=pc[p.timbalan]||{n:0,b:0,t:0};pc[p.timbalan].t++}});
  o+='<div class="card"><h3>Agihan pengarah program</h3><table class="mini"><thead><tr><th>Nama</th><th style="text-align:right">Pengarah</th><th style="text-align:right">Prog. besar</th><th style="text-align:right">Timbalan</th></tr></thead><tbody>';

  o+='</tbody></table></div>';
  /* program besar */
  o+='<div class="card"><h3>★ Program besar &amp; giliran</h3><table class="mini"><thead><tr><th>Tarikh</th><th>Program</th><th>Pengarah</th><th>Timbalan</th></tr></thead><tbody>';
  P.filter(function(p){return p.kat==='besar'}).forEach(function(p){o+='<tr><td style="white-space:nowrap">'+fmtD(p.tarikh)+'</td><td>'+esc(p.nama)+'</td><td>'+esc(p.pengarah||'–')+'</td><td>'+esc(p.timbalan||'–')+'</td></tr>'});
  o+='</tbody></table></div>';
  /* warnings */
  var W=[];P.forEach(function(p){var w=semak(p).filter(function(x){return x.l!=='info'});if(w.length)W.push({p:p,w:w})});
  var I=[];P.forEach(function(p){var w=semak(p).filter(function(x){return x.l==='info'});if(w.length)I.push({p:p,w:w})});
  o+='<div class="card"><h3>Perkara perlu disemak</h3>';

  o+='</div></div>';
  $('#v-semakan').innerHTML=o;
}

/* ---- change / draft ---- */
function changed(msg){
  dirty=true;CHG++;
  try{localStorage.setItem(LS+':draf',JSON.stringify({base:BASE,at:new Date().toISOString(),data:S}))}catch(e){}
  renderAll();
  var auto=AUTO.handle&&AUTO.st!=='conflict';
  if(msg)toast(msg+(auto?' Disimpan automatik.':' Tekan Simpan untuk simpan ke fail.'));
  autoQueue();
}
function checkDraft(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS+':draf')||'null')}catch(e){}
  if(!d||!d.data||!d.at)return;
  if(d.at<=S.meta.kemaskini){try{localStorage.removeItem(LS+':draf')}catch(e){}return}
  var b=$('#banner');b.hidden=false;

  b.innerHTML='<div class="in"><span>⚠ Ada perubahan <b>belum disimpan</b> dari '+esc(fmtStamp(d.at))+'.'+(old?' <b>Perhatian:</b> fail ini telah dikemas kini selepas itu — pulihkan hanya jika pasti.':'')+'</span><span style="display:flex;gap:6px"><button class="btn" data-a="dropdraft">Buang</button><button class="btn pri" data-a="restore">Pulihkan</button></span></div>';
  $('[data-a=restore]',b).onclick=function(){S=d.data;BASE=d.base;b.hidden=true;$('#v-senarai').dataset.built='';changed('Draf dipulihkan.')};
  $('[data-a=dropdraft]',b).onclick=function(){try{localStorage.removeItem(LS+':draf')}catch(e){}b.hidden=true};

/* ---- save (rebuilds this whole HTML file with the new data) ---- */
function buildFile(D,ro){
  D=D||S;
  var json=JSON.stringify(D,null,1).replace(/</g,'\\u003c');
  var E='</'+'script>';
  var ico=ro&&ICO_H?ICO_H:ICO, icot=ro&&ICOT_H?ICOT_H:ICOT, shell=(ro&&IMG_APP_H&&IMG_APP)?SHELL.split('id="img-app" src="'+IMG_APP+'"').join('id="img-app" src="'+IMG_APP_H+'"'):SHELL;
  return '<!DOCTYPE html>\n<html lang="ms">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc((ro?'HEBAHAN ':'')+D.meta.tajuk+' '+D.meta.tahun)+'</title>\n'+
   (ico?'<link id="ico" rel="icon" type="image/png" href="'+ico+'">\n':'')+(icot?'<link id="ico-touch" rel="apple-touch-icon" href="'+icot+'">\n':'')+'<meta name="theme-color" content="#14234A">\n<meta name="apple-mobile-web-app-title" content="'+(ro?'Hebahan JPPS':'Takwim JPPS')+'">\n'+
   (FONT?'<link id="font-link" rel="stylesheet" href="'+esc(FONT)+'">\n':'')+
   '<style id="app-css">'+CSS+'</style>\n</head>\n<body>\n<div id="app">'+shell+'</div>\n<script type="application/json" id="takwim-data">\n'+json+'\n'+E+'\n<script id="app-js">'+JS+E+'\n</body>\n</html>\n';
}
function fileName(){return (S.meta.tajuk+' '+S.meta.tahun).replace(/[\\/:*?"<>|]/g,'')+'.html'}
function stampOf(text){var m=/"kemaskini":\s*"([^"]+)"/.exec(text||'');return m?m[1]:null}
function download(name,content,type){
  var blob=new Blob([content],{type:type||'text/html;charset=utf-8'});var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function stampNow(){S.meta.kemaskini=new Date().toISOString();S.meta.versi=(S.meta.versi||1)+1}
function afterSaved(where,quiet,c){
  BASE=S.meta.kemaskini;
  if(c==null||c===CHG){dirty=false;try{localStorage.removeItem(LS+':draf')}catch(e){}}
  renderHeader();renderAuto();if(!quiet)toast('✓ Disimpan '+where);
}
function readStamp(h){return h.getFile().then(function(f){return f.text()}).then(stampOf).catch(function(){return null})}
function writeTo(h){return h.createWritable().then(function(w){return w.write(buildFile()).then(function(){return w.close()})})}
function ensurePerm(h){
  if(!h.queryPermission)return Promise.resolve();
  return h.queryPermission({mode:'readwrite'}).then(function(p){if(p==='granted')return;return h.requestPermission({mode:'readwrite'}).then(function(q){if(q!=='granted')throw new Error('Kebenaran ditolak')})});
}
function askOverwrite(name,st){
  return ask('Fail telah dikemas kini oleh orang lain','Fail <b>'+esc(name)+'</b> telah disimpan pada <b>'+esc(fmtStamp(st))+'</b>, selepas anda membuka takwim ini. Jika diteruskan, perubahan mereka akan <b>ditimpa</b>.<br><br>Cadangan: Batal, Eksport JSON sebagai sandaran, buka semula fail terkini (F5) dan buat semula perubahan anda.','Timpa juga',true);
}
function simpan(asNew){
  var prev={k:S.meta.kemaskini,v:S.meta.versi},c=CHG;
  function fallback(){stampNow();download(fileName(),buildFile());afterSaved('— fail dimuat turun ke Downloads. Gantikan fail dalam share folder.')}
  if(!window.showSaveFilePicker)return fallback();
  clearTimeout(AUTO.timer);
  var h=asNew?null:fileHandle;
  var pick=h?Promise.resolve(h):window.showSaveFilePicker({suggestedName:fileName(),types:[{description:'Fail HTML Takwim',accept:{'text/html':['.html','.htm']}}]});
  return pick.then(function(handle){
    return ensurePerm(handle).then(function(){return readStamp(handle)}).then(function(st){
      if(st&&st>BASE)return askOverwrite(handle.name,st).then(function(ok){return ok?handle:null});
      return handle;
    });
  }).then(function(handle){
    if(!handle)return;
    stampNow();
    return writeTo(handle).then(function(){
      fileHandle=handle;var first=AUTO.handle!==handle;
      if(AUTO.ok){setAutoHandle(handle);if(first)toast('✓ Disimpan ke "'+handle.name+'". Auto-simpan kini HIDUP untuk fail ini.')}
      afterSaved('ke "'+handle.name+'"',AUTO.ok&&first,c);
    });
  }).catch(function(e){
    if(e&&e.name==='AbortError')return;
    S.meta.kemaskini=prev.k;S.meta.versi=prev.v;
    console.warn(e);fallback();
  });
}

/* ---- auto-save: writes to the linked file ~1s after every change ---- */
var CHG=0;
var AUTO={ok:!!(window.showSaveFilePicker&&window.showOpenFilePicker&&window.indexedDB),handle:null,st:'off',timer:null,busy:false,again:false,last:null};
function idbDo(mode,fn){return new Promise(function(res,rej){
  var r=indexedDB.open('takwim-jpps',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('h')};
  r.onerror=function(){rej(r.error)};
  r.onsuccess=function(){try{var db=r.result,tx=db.transaction('h',mode),q=fn(tx.objectStore('h'));tx.oncomplete=function(){res(q&&q.result);db.close()};tx.onerror=function(){rej(tx.error)}}catch(e){rej(e)}};
})}
function setAutoHandle(h){
  AUTO.handle=h;fileHandle=h;AUTO.st='ready';
  idbDo('readwrite',function(st){return st.put(h,LS)}).catch(function(){});
  renderAuto();
}
function autoOff(){
  clearTimeout(AUTO.timer);AUTO.handle=null;AUTO.st='off';
  idbDo('readwrite',function(st){return st.delete(LS)}).catch(function(){});
  renderAuto();toast('Auto-simpan dimatikan. Guna butang Simpan untuk menyimpan.');
}
function autoInit(){
  renderAuto();if(!AUTO.ok)return;
  idbDo('readonly',function(st){return st.get(LS)}).then(function(h){
    if(!h||!h.queryPermission)return;
    AUTO.handle=h;fileHandle=h;
    return h.queryPermission({mode:'readwrite'}).then(function(p){AUTO.st=p==='granted'?'ready':'perm';renderAuto()});
  }).catch(function(){});
}
function autoGrant(){
  if(!AUTO.handle)return Promise.resolve(false);
  return AUTO.handle.requestPermission({mode:'readwrite'}).then(function(p){AUTO.st=p==='granted'?'ready':'perm';renderAuto();return p==='granted'}).catch(function(){return false});
}
function autoQueue(){
  if(!AUTO.handle||AUTO.st==='conflict')return;
  if(AUTO.st==='perm'){autoGrant().then(function(g){if(g)autoQueue()});return}
  clearTimeout(AUTO.timer);AUTO.timer=setTimeout(autoWrite,1000);
  if(!AUTO.busy){AUTO.st='pending';renderAuto()}
}
function autoWrite(){
  clearTimeout(AUTO.timer);
  if(!AUTO.handle||!dirty||AUTO.st==='conflict'||AUTO.st==='perm')return Promise.resolve();
  if(AUTO.busy){AUTO.again=true;return Promise.resolve()}
  AUTO.busy=true;AUTO.st='saving';renderAuto();
  var h=AUTO.handle,c=CHG,prev={k:S.meta.kemaskini,v:S.meta.versi};
  return readStamp(h).then(function(st){
    if(st&&st>BASE){AUTO.st='conflict';showConflict(st);return}
    stampNow();
    return writeTo(h).then(function(){AUTO.last=new Date();AUTO.st='ready';afterSaved('',true,c)},function(e){S.meta.kemaskini=prev.k;S.meta.versi=prev.v;throw e});
  }).catch(function(e){console.warn(e);AUTO.st=(e&&e.name==='NotAllowedError')?'perm':'error'}).then(function(){
    AUTO.busy=false;renderAuto();
    if(AUTO.again||(dirty&&AUTO.st==='ready')){AUTO.again=false;autoQueue()}
  });
}
function showConflict(st){
  var b=$('#banner');b.hidden=false;
  b.innerHTML='<div class="in" style="background:#FDECEC;border-color:#E9A3A3"><span>⛔ <b>Auto-simpan dihentikan.</b> Fail dalam share folder telah dikemas kini oleh orang lain pada <b>'+esc(fmtStamp(st))+'</b>. Perubahan anda masih ada di skrin ini.</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-c="json">Eksport sandaran</button><button class="btn" data-c="reload">Buka versi terkini</button><button class="btn danger" data-c="force">Timpa dengan versi saya</button></span></div>';
  $('[data-c=json]',b).onclick=exportJSON;
  $('[data-c=reload]',b).onclick=function(){dirty=false;location.reload()};
  $('[data-c=force]',b).onclick=function(){BASE=st;AUTO.st='ready';b.hidden=true;autoWrite()};
  renderAuto();
}
function hhmm(d){var h=d.getHours(),m=d.getMinutes();return (h%12||12)+'.'+pad(m)+(h<12?' pg':' ptg')}
function renderAuto(){
  var b=$('#b-auto');if(!b)return;
  if(!AUTO.ok){b.hidden=true;return}
  b.hidden=false;var t,c;
  switch(AUTO.st){
    case 'off':t='Auto-simpan: Mati';c='au-off';break;
    case 'perm':t='Auto-simpan: klik untuk sambung';c='au-warn';break;
    case 'pending':case 'saving':t='Menyimpan…';c='au-busy';break;
    case 'conflict':t='Auto-simpan dihentikan';c='au-err';break;
    case 'error':t='Auto-simpan gagal – klik';c='au-err';break;
    default:t=AUTO.last?'Auto-simpan ✓ '+hhmm(AUTO.last):'Auto-simpan: Hidup';c='au-on';
  }
  b.className='btn au '+c;b.querySelector('span.t').textContent=t;
  b.title=AUTO.handle?'Fail: '+AUTO.handle.name:'Hidupkan auto-simpan ke fail takwim dalam share folder';
}
function autoEnable(){
  window.showOpenFilePicker({multiple:false,types:[{description:'Fail HTML Takwim',accept:{'text/html':['.html','.htm']}}]}).then(function(arr){
    var h=arr[0];
    return ensurePerm(h).then(function(){return h.getFile()}).then(function(f){return f.text()}).then(function(txt){
      var k=/"kunci":\s*"([^"]+)"/.exec(txt),y=/"tahun":\s*(\d+)/.exec(txt);
      if(!k||k[1]!==S.meta.kunci||!y||+y[1]!==+S.meta.tahun){toast('Fail itu bukan '+S.meta.tajuk+' '+S.meta.tahun+'. Pilih fail takwim yang sedang dibuka.');return}
      var st=stampOf(txt);
      var go=(st&&st>BASE)?askOverwrite(h.name,st):Promise.resolve(true);
      return go.then(function(ok){if(!ok)return;if(st&&st>BASE)BASE=st;setAutoHandle(h);toast('Auto-simpan HIDUP untuk "'+h.name+'".');if(dirty)autoWrite()});
    });
  }).catch(function(e){if(!(e&&e.name==='AbortError')){console.warn(e);toast('Tidak dapat menghidupkan auto-simpan.')}});
}
function autoClick(){
  if(AUTO.st==='off')return autoEnable();
  if(AUTO.st==='perm')return autoGrant().then(function(g){if(g){toast('Auto-simpan disambung.');if(dirty)autoWrite()}});
  if(AUTO.st==='error')return autoGrant().then(function(){autoWrite()});
  if(AUTO.st==='conflict')return;
  openDlg('Auto-simpan','<p style="margin:0 0 8px">Auto-simpan <b class="ok">HIDUP</b>. Setiap perubahan disimpan terus ke fail:</p><p style="margin:0 0 10px;font-weight:600">📄 '+esc(AUTO.handle?AUTO.handle.name:'')+'</p><p style="font-size:12.5px;color:var(--muted);margin:0">Simpanan terakhir: '+(AUTO.last?esc(fmtStamp(AUTO.last.toISOString())):'–')+'. Tetapan ini diingat pada komputer ini sahaja; setiap pengguna perlu menghidupkannya sekali di komputer masing-masing.</p>','<button class="btn danger" data-off>Matikan auto-simpan</button><span class="sp"></span><button class="btn pri" data-x>Tutup</button>',function(dl){$('[data-off]',dl).onclick=function(){closeDlg();autoOff()}});
}

/* ---- export / import ---- */
function exportCSV(){
  var rows=[['Bil','Tarikh','Hingga','Hari','Tarikh Hijri','Masa','Program','Label Takwim','Kategori','Pengarah','Timbalan','Tempat','Status','Catatan']];

  var csv=rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n');

/* ---- calendar (Google / Outlook / .ics) ---- */
var TZ='Asia/Kuala_Lumpur';
function parseMasa(txt){
  var t=String(txt||'').toLowerCase().replace(/[–—]/g,'-');
  var re=/(\d{1,2})[.:](\d{2})\s*(pagi|pg|petang|ptg|tengah ?hari|malam|mlm)?/g,m,tok=[];
  while((m=re.exec(t)))tok.push({h:+m[1],mi:+m[2],s:m[3]||''});
  var glob=(t.match(/(pagi|petang|malam|tengah ?hari)(?!.*(pagi|petang|malam|tengah ?hari))/)||[])[1]||'';
  function conv(x,suf){var h=x.h;suf=suf||'';if(/petang|ptg|malam|mlm/.test(suf)&&h<12)h+=12;if(/tengah/.test(suf)&&h<11)h+=12;return h*60+x.mi}
  if(tok.length){
    var a=conv(tok[0],tok[0].s||glob),b;
    b=tok.length>1?conv(tok[1],tok[1].s||glob):a+120;
    if(b<=a&&a>=720&&tok[0].s==='')a-=720;
    if(b<=a)b=a+60;
    return {a:a,b:b};
  }
  if(/pagi/.test(t)&&/petang/.test(t))return {a:510,b:1020};
  if(/sepanjang|seharian/.test(t)||!t.trim())return null;
  if(/petang/.test(t))return {a:870,b:1020};
  if(/pagi/.test(t))return {a:510,b:750};
  if(/malam/.test(t))return {a:1230,b:1350};
  return null;
}
function endOf(p){return p.hingga&&p.hingga>p.tarikh?p.hingga:p.tarikh}
function nDays(p){return diff(p.tarikh,endOf(p))+1}
function utcAt(ds,min){return new Date(toD(ds).getTime()+(min-480)*60000)}
function icsStamp(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function icsDate(s){return s.replace(/-/g,'')}
function calTitle(p){return (p.kat==='besar'?'★ ':'')+p.nama}
function calPlace(p){return p.tempat?p.tempat+', '+S.meta.organisasi:S.meta.organisasi}
function calDesc(p){
  var k=katById(p.kat),L=[k.nama];
  if(p.masa)L.push('Masa: '+p.masa);
  L.push(HARI[dow(p.tarikh)]+', '+fmtD(p.tarikh,true)+(endOf(p)>p.tarikh?' – '+fmtD(endOf(p),true):'')+' ('+hLong(p.tarikh)+')');
  if(p.catatan)L.push(p.catatan);
  if(k.ket)L.push(k.ket);
  L.push('Anjuran: '+S.meta.jabatan+', '+S.meta.organisasi);
  if(S.meta.nota)L.push(S.meta.nota);
  return L.join('\n');
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){var out='',i=0;while(line.length-i>70){out+=line.slice(i,i+70)+'\r\n ';i+=70}return out+line.slice(i)}
function vevent(p){
  var tm=parseMasa(p.masa),n=nDays(p),L=['BEGIN:VEVENT','UID:'+p.id+'-'+p.tarikh+'@takwim-jpps-pusrawi','DTSTAMP:'+icsStamp(new Date())];
  if(tm){L.push('DTSTART:'+icsStamp(utcAt(p.tarikh,tm.a)),'DTEND:'+icsStamp(utcAt(p.tarikh,tm.b)));if(n>1)L.push('RRULE:FREQ=DAILY;COUNT='+n)}
  else L.push('DTSTART;VALUE=DATE:'+icsDate(p.tarikh),'DTEND;VALUE=DATE:'+icsDate(addDays(endOf(p),1)));
  L.push('SUMMARY:'+icsEsc(calTitle(p)),'DESCRIPTION:'+icsEsc(calDesc(p)),'LOCATION:'+icsEsc(calPlace(p)),'CATEGORIES:'+icsEsc(katName(p.kat)));
  if(p.status==='Ditangguh')L.push('STATUS:CANCELLED');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(p.nama),'TRIGGER:-P1D','END:VALARM','END:VEVENT');

    R.forEach(function(p,i){
      var m=+p.tarikh.slice(5,7)-1,first=i===0||+R[i-1].tarikh.slice(5,7)-1!==m,cnt=R.filter(function(q){return +q.tarikh.slice(5,7)-1===m}).length;
      o+='<tr>'+(first?'<td class="c" rowspan="'+cnt+'">'+BULAN[m].toUpperCase()+'</td>':'')+'<td class="c">'+dt(p)+'</td><td class="c">'+ms(p)+'</td><td>'+esc(p.nama.toUpperCase())+'</td>'+(withPeng?'<td>'+esc(p.pengarah||'')+'</td>':'')+'</tr>';
    });
    o+='</tbody></table>';
  }
  return o+'<div class="nt">'+esc(S.meta.nota||'')+'</div></div></div>';
}
/* shrink the hebahan so it always fits one A4 page */
function fitHeb(pa){
  var keep=pa.getAttribute('style')||'';
  pa.style.cssText='display:block;position:absolute;left:-20000px;top:0;width:186mm;visibility:hidden';
  var hb=$('.hb',pa),inn=$('.hbin',pa),mm=parseFloat(getComputedStyle(pa).width)/186,max=270*mm,fs=10.5,k=0;
  hb.style.fontSize=fs+'pt';
  while(inn.getBoundingClientRect().height>max&&fs>5.5&&k<40){fs-=0.2;hb.style.fontSize=fs.toFixed(2)+'pt';k++}
  pa.setAttribute('style',keep);
}
function preparePrint(mode,withPeng){
  var pa=document.getElementById('print-area');
  if(!pa){pa=document.createElement('div');pa.id='print-area';document.body.appendChild(pa)}
  buildIndex();var y=S.meta.tahun,o='',m;
  if(mode==='g1'){o='<div class="pp pg1"><div class="page fill">'+printHead()+'<div class="pgrid">';for(m=0;m<12;m++)o+=monthHTML(y,m);o+='</div>'+printLegend()+'</div></div>'}
  else if(mode==='g2'){o='<div class="pp pg2">';[[0,6],[6,12]].forEach(function(r,i){o+='<div class="page fill">'+printHead('Bahagian '+(i+1)+' / 2')+'<div class="pgrid">';for(m=r[0];m<r[1];m++)o+=monthHTML(y,m);o+='</div>'+printLegend()+'</div>'});o+='</div>'}
  else if(mode==='list')o=listPrint(withPeng);
  else o=hebahanPrint(withPeng);
  pa.innerHTML=o;printMode=mode;
  if(mode==='g1'||mode==='g2')fitPrint(pa);
  if(mode==='heb')fitHeb(pa);
  if(mode==='list')fitOne(pa);
}
/* stretch months to fill the A4 page with equal-size boxes, then shrink any label that does not fit */
function fitPrint(pa){
  var keep=pa.getAttribute('style')||'';
  pa.style.cssText='display:block;position:absolute;left:-20000px;top:0;width:186mm;visibility:hidden';
  var mm=parseFloat(getComputedStyle(pa).width)/186;
  $$('.page.fill',pa).forEach(function(pg){
    var grid=$('.pgrid',pg),months=$$('.month',grid);if(!months.length)return;
    var gap=parseFloat(getComputedStyle(grid).rowGap)||0,rows=Math.ceil(months.length/2);
    var mh=(grid.getBoundingClientRect().height-gap*(rows-1))/rows;
    months.forEach(function(mo){
      var head=$('.mh',mo).getBoundingClientRect().height+$('thead',mo).getBoundingClientRect().height;
      var trs=$$('tbody tr',mo),avail=mh-head-3-trs.length*1.2;
      var h=Math.floor(avail/trs.length*10)/10;   /* all boxes the same size */
      $$('.cw',mo).forEach(function(c){c.style.height=h+'px'});
    });
  });
  var cx=document.createElement('canvas').getContext('2d');
  $$('.chip,.hn',pa).forEach(function(e){
    var cs=getComputedStyle(e),w=e.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-1;if(w<=0)return;
    cx.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;var mx=0;
    e.textContent.toUpperCase().split(/\s+/).forEach(function(t){mx=Math.max(mx,cx.measureText(t).width)});
    if(mx>w)e.style.fontSize=(parseFloat(cs.fontSize)*w/mx)+'px';
  });
  $$('.cw',pa).forEach(function(c){
    var it=$$('.chip,.hn',c);if(!it.length)return;var n=0;
    while(c.scrollHeight>c.clientHeight+0.5&&n<14){var ch2=false;it.forEach(function(e){var f=parseFloat(getComputedStyle(e).fontSize);if(f>3.9){e.style.fontSize=Math.max(3.9,f*0.94)+'px';ch2=true}e.style.lineHeight='1'});if(!ch2)break;n++}
  });
  pa.setAttribute('style',keep);
}
window.addEventListener('beforeprint',function(){if(!printMode)preparePrint('g2')});
window.addEventListener('afterprint',function(){printMode=null});
function openPrint(){
  var o='<label class="opt"><input type="radio" name="pm" value="g1" checked><div><b>Takwim penuh – 1 muka surat A4</b><span>12 bulan dalam satu halaman, sesuai untuk ditampal.</span></div></label>'+
  '<label class="opt"><input type="radio" name="pm" value="g2"><div><b>Takwim – 2 muka surat A4</b><span>Jan–Jun &amp; Jul–Dis, tulisan lebih besar dan mudah dibaca.</span></div></label>'+
  '<label class="opt"><input type="radio" name="pm" value="list"><div><b>Senarai program (ikut bulan) – 1 muka surat</b><span>Jadual ringkas: tarikh, hari, Hijri, masa dan program.</span></div></label>'+
  '<label class="opt"><input type="radio" name="pm" value="heb"><div><b>Hebahan program – 1 muka surat</b><span>Format rasmi hebahan: Taklimat, Fardhu Ain, Ceramah &amp; Program Bulanan.</span></div></label>'+
  (RO?'':'<label class="chk" style="margin-top:6px"><input type="checkbox" id="pm-peng"> Sertakan nama pengarah (senarai/hebahan)</label>')+
  '<p style="font-size:12px;color:var(--muted);margin:10px 0 0">Tip: dalam tetingkap cetak, pilih kertas <b>A4</b> dan tandakan <b>Background graphics</b> supaya warna keluar.</p>';
  openDlg('Cetak',o,'<span class="sp"></span><button class="btn ghost" data-x>Batal</button><button class="btn pri" data-go>Cetak</button>',function(dl){
    $('[data-go]',dl).onclick=function(){var mode=$('input[name=pm]:checked',dl).value,pg=!!($('#pm-peng',dl)&&$('#pm-peng',dl).checked);closeDlg();preparePrint(mode,pg);setTimeout(function(){window.print()},120)};
  });
}

/* ---- events ---- */
$$('.tabs button').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v)})});
$('#b-add').addEventListener('click',function(){openProgram(null)});
$('#b-calall').addEventListener('click',calAll);
$('#b-print').addEventListener('click',openPrint);
$('#b-save').addEventListener('click',function(){simpan(false)});
var more=$('#m-more');
$('#b-more').addEventListener('click',function(e){e.stopPropagation();more.hidden=!more.hidden});
document.addEventListener('click',function(e){if(!more.hidden&&!more.contains(e.target))more.hidden=true});
function action(a){
  more.hidden=true;
  if(a==='saveas')simpan(true);else if(a==='csv')exportCSV();else if(a==='hebahan')exportHebahan();else if(a==='calall')calAll();else if(a==='json')exportJSON();else if(a==='import')$('#f-import').click();
  else if(a==='settings')openSettings();else if(a==='help')openHelp();else if(a==='add')openProgram(null);else if(a==='addT')openTarikh(null);else if(a==='addS')openSekolah(null);
}
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target;
  var act=t.closest('[data-a]');if(act&&!act.closest('#banner')){action(act.dataset.a);return}
  var lg=t.closest('.lg');if(lg){hide[lg.dataset.k]=!hide[lg.dataset.k];renderAll();return}
  if(t.closest('dialog'))return;
  if(t.closest('.calbtns'))return;
  var chip=t.closest('[data-p]');if(chip){if(RO)openView(chip.dataset.p);else openProgram(chip.dataset.p);return}
  if(RO&&(t.closest('tr[data-t]')||t.closest('tr[data-s]')))return;
  var tr=t.closest('tr[data-t]');if(tr){openTarikh(tr.dataset.t);return}
  var ts=t.closest('tr[data-s]');if(ts){openSekolah(ts.dataset.s);return}
  var day=t.closest('td.day');if(day){if(RO)openDayRO(day.dataset.d);else openDay(day.dataset.d);return}
});
document.addEventListener('keydown',function(e){
  if(!RO&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();simpan(false)}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();openPrint()}
});
window.addEventListener('beforeunload',function(e){if(!dirty)return;if(AUTO.handle&&AUTO.st!=='conflict'&&AUTO.st!=='perm')autoWrite();e.preventDefault();e.returnValue=''});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&dirty&&AUTO.handle)autoWrite()});
$('#b-auto').addEventListener('click',autoClick);

/* ---- start ---- */
try{document.fonts&&document.fonts.load('700 10px TakwimCond')}catch(e){}
if(RO){
  document.body.classList.add('ro');
  ['#b-add','#b-save','#b-auto','#b-more'].forEach(function(s){var el=$(s);if(el)el.hidden=true});
  $('.tabs button[data-v=semakan]').hidden=true;$('#b-calall').hidden=false;
  LS+=':ro';
}
setView('takwim');
if(!RO){checkDraft();autoInit();}
})();
